

env = WAYLAND_DISPLAY, wayland-1

###################
### AUTOSTART ###
###################
exec-once = quickshell

###################
### MY PROGRAMS ###
###################
$terminal = foot
$fileManager = dolphin
$menu = rofi -show run
$mainMod = SUPER


#############
### INPUT ###
#############
input {
    kb_layout = us
    kb_variant = dvorak
    kb_model =
    kb_options =
    kb_rules =
}

###################
### KEYBINDINGS ###
###################
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
